# ============================================================
# DIDIQC — Restore Database dari Backup R2
#
# HANYA bisa dijalankan MANUAL (workflow_dispatch) oleh administrator.
# Tidak pernah berjalan otomatis/jadwal.
#
# Target:
#   neon                → $NEON_DATABASE_URL (DR / pemulihan ke Neon, scope app)
#   staging             → $STAGING_DATABASE_URL atau URL di input restore_target_url
#   custom              → URL di input restore_target_url
#   insforge-production → $INSFORGE_DATABASE_URL — WAJIB isi confirm=RESTORE-PRODUCTION
#                         (otomatis buat backup keselamatan dulu + prosedur rollback)
#
# Secrets yang dibutuhkan:
#   INSFORGE_DATABASE_URL, R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#   R2_BUCKET, R2_PREFIX, NEON_DATABASE_URL (opsional), STAGING_DATABASE_URL (opsional),
#   BACKUP_ALERT_WEBHOOK (opsional)
# ============================================================

name: DIDIQC Restore Database

on:
  workflow_dispatch:
    inputs:
      backup_file:
        description: 'File backup: "latest", tanggal "2026-10-21", atau nama lengkap "didiqc_2026-10-21_020000.dump"'
        type: string
        default: 'latest'
      target:
        description: 'Database tujuan'
        type: choice
        options:
          - neon
          - staging
          - custom
          - insforge-production
        default: staging
      scope:
        description: 'Cakupan restore'
        type: choice
        options:
          - app      # hanya schema public (tabel aplikasi DIDIQC) — aman untuk Neon/staging
          - full     # seluruh isi dump — hanya untuk target sejenis InsForge
        default: app
      clean:
        description: 'Bersihkan schema public tujuan dulu? (yes = replace penuh)'
        type: choice
        options: [yes, no]
        default: yes
      tables:
        description: '(Opsional, selektif) nama tabel dipisah koma, contoh: parameters,master_tea'
        type: string
        default: ''
      data_only:
        description: '(Selektif) hanya data, tidak mengubah struktur'
        type: boolean
        default: false
      truncate_tables:
        description: '(Selektif, data_only) kosongkan tabel ini dulu, dipisah koma'
        type: string
        default: ''
      restore_target_url:
        description: 'URL PostgreSQL tujuan (wajib bila target=staging/custom yang belum diset di secrets)'
        type: string
        default: ''
      confirm:
        description: 'WAJIB ketik RESTORE-PRODUCTION bila target=insforge-production'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: didiqc-db-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BACKUP_FILE: ${{ github.event.inputs.backup_file }}
      RAW_TARGET: ${{ github.event.inputs.target }}
      SCOPE: ${{ github.event.inputs.scope }}
      CLEAN: ${{ github.event.inputs.clean }}
      TABLES: ${{ github.event.inputs.tables }}
      DATA_ONLY: ${{ github.event.inputs.data_only }}
      TRUNCATE_TABLES: ${{ github.event.inputs.truncate_tables }}
      RESTORE_TARGET_URL: ${{ github.event.inputs.restore_target_url }}
      CONFIRM: ${{ github.event.inputs.confirm }}
      INSFORGE_DATABASE_URL: ${{ secrets.INSFORGE_DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PREFIX: ${{ secrets.R2_PREFIX }}
      BACKUP_ALERT_WEBHOOK: ${{ secrets.BACKUP_ALERT_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validasi konfirmasi produksi (fail-fast)
        run: |
          set -euo pipefail
          if [ "$RAW_TARGET" = "insforge-production" ] && [ "$CONFIRM" != "RESTORE-PRODUCTION" ]; then
            echo "::error::Restore ke produksi wajib isi input 'confirm' = RESTORE-PRODUCTION"
            exit 1
          fi
          if [ "$RAW_TARGET" = "custom" ] && [ -z "$RESTORE_TARGET_URL" ]; then
            echo "::error::Target custom wajib mengisi input 'restore_target_url'"
            exit 1
          fi
          echo "Validasi OK (target=$RAW_TARGET, scope=$SCOPE, clean=$CLEAN)."

      - name: Pasang PostgreSQL client 15
        run: |
          mkdir -p "$HOME/opt-pg" && cd "$HOME/opt-pg"
          curl -sSL -o pg15.tar.gz \
            "https://github.com/theseus-rs/postgresql-binaries/releases/download/15.8.0/postgresql-15.8.0-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf pg15.tar.gz
          echo "$HOME/opt-pg/postgresql-15.8.0-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
          pg_restore --version

      - name: Jalankan restore
        env:
          RESTORE_CONFIRM_PRODUCTION: ${{ github.event.inputs.confirm }}
          RESTORE_JOBS: ${{ secrets.RESTORE_JOBS }}
        run: |
          set -euo pipefail
          ARGS=(--backup-file "$BACKUP_FILE" --target "$([ "$RAW_TARGET" = "insforge-production" ] && echo insforge || echo "$RAW_TARGET")" --scope "$SCOPE" --clean "$CLEAN")
          [ -n "$TABLES" ]          && ARGS+=(--tables "$TABLES")
          [ "$DATA_ONLY" = "true" ] && ARGS+=(--data-only)
          [ -n "$TRUNCATE_TABLES" ] && ARGS+=(--truncate "$TRUNCATE_TABLES")
          bash scripts/backup/db-restore.sh "${ARGS[@]}"
